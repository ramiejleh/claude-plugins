<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive PR Review</title>
<!--
  Self-contained interactive PR review UI — the SKELETON only (structure + tokens).

  This file is markup. The stylesheet lives in ui.css and the behaviour in ui.js, both in
  this directory; keep editing those, not a copy pasted in here. The build step inlines
  everything, so the generated page stays a single self-contained file with no network
  dependency at view time.

  Claude (via the pr-review-ui skill) produces the final file with a small injection
  script that replaces five placeholder tokens, each of which appears EXACTLY ONCE
  below (do not add copies of them here — the injector replaces every occurrence):
    1.  HLJS_LIB token   (in a <script>) → the contents of vendor/highlight.min.js
    2.  HLJS_THEME token (in a <style>)  → the contents of vendor/hljs-github-theme.css
    3.  UI_CSS token     (in a <style>)  → the contents of ui.css
    4.  UI_JS token      (in a <script>) → the contents of ui.js
    5.  PR_REVIEW_DATA token             → the grouping JSON object (see skill schema)
  Everything else is fixed, so every generated page has the SAME structure and only
  the data differs. Do not hand-edit the markup per-PR.

  Line comments cover a RANGE: clicking a line comments on it alone, dragging across lines
  comments on the whole span. The span stays tinted while its editor is open, and on save the
  tint gives way to the saved comment's rail. A comment is keyed and anchored by its LAST line
  (what GitHub anchors to) and carries `startLine`; the export adds start_line/start_side when
  they differ.

  Each file in the data may carry an insights[] array: read-only 💡 bubbles that
  explain the code (function purpose, non-obvious logic, gotchas). They render under
  their anchored diff line, are toggled from the sidebar, and are NEVER included in the
  exported review JSON — they are guidance for the reviewer, not review comments.
-->
<style>
  /* __HLJS_THEME__ */
</style>
<style>
  /* __UI_CSS__ */
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <!-- Collapse: hides everything but this button (no animation). -->
    <button class="sb-collapse" id="sb-collapse" type="button" title="Collapse sidebar">«</button>

    <div class="sb-inner">
      <div class="pr-head">
        <h1 id="pr-title">PR Review</h1>
        <div class="pr-sub" id="pr-sub"></div>
        <div class="stats" id="pr-stats"></div>
      </div>

      <!-- Review: the main action — compose and export your comments. Stays at the top. -->
      <section class="sep">
        <span class="section-label">Review summary
          <span class="count-pill" id="comment-count">0</span></span>
        <textarea id="summary" placeholder="Overall thoughts on this PR (optional if you left inline or file comments)…"></textarea>
        <button class="primary" id="copy-btn">Copy all comments as JSON</button>
      </section>

      <!-- View: how the diff is displayed, and what extras are shown alongside it. -->
      <section class="sep">
        <span class="section-label">Diff view</span>
        <select id="view-mode">
          <option value="unified">Unified (inline)</option>
          <option value="split">Split (side by side)</option>
        </select>
        <span class="hint" id="view-hint"></span>
      </section>

      <section>
        <span class="section-label">Show</span>
        <div class="toggle-grid">
          <label class="toggle-chip" title="Read-only code explanations on each block">
            <input type="checkbox" id="toggle-insights" checked />
            <span>💡 Insights</span>
            <span class="count-pill" id="insight-count">0</span>
          </label>
          <label class="toggle-chip" title="Each group's list of things worth a closer look">
            <input type="checkbox" id="toggle-confirm" checked />
            <span>✓ Things to confirm</span>
            <span class="count-pill" id="confirm-count">0</span>
          </label>
          <label class="toggle-chip" title="Each group's File | Role manifest table">
            <input type="checkbox" id="toggle-manifest" checked />
            <span>📄 Files table</span>
          </label>
        </div>
      </section>

      <!-- Navigate: jump around the diff by file or by group. -->
      <details class="sb-section sep" id="sec-files" open>
        <summary class="section-label">Files changed <span class="count-pill" id="file-count">0</span></summary>
        <nav class="filetree" id="filetree"></nav>
      </details>

      <details class="sb-section" id="sec-groups" open>
        <summary class="section-label">Groups</summary>
        <nav class="toc" id="toc"></nav>
      </details>

      <section class="sep">
        <button class="danger-btn" id="discard-btn">Delete Cached Comments</button>
      </section>
    </div>
  </aside>

  <main id="groups"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* __HLJS_LIB__ */
</script>
<script>
/* __UI_JS__ */
</script>
</body>
</html>
